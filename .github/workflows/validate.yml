name: Validate package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run package validator
        run: python3 scripts/validate-package.py
      - name: Run eval self-checks
        run: python3 evals/run_evals.py
